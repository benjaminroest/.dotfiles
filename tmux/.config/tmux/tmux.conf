# Colorscheme (use literal values)
set status-interval 1
set -g status-bg "#171B20"
set -g status-fg "#E7EAEE"
set -g status-justify left

set -g status-left-length 100
set -g status-left-style bg="#38FFA5",fg="#171B20",none
set -g status-left " #S "

set -g status-right-style bg="#5CCEFF",fg="#171B20",none
set -g status-right-length 102
set -g status-right " #{?#{pane_ssh_connected},#U @ #H#[default],local} "

set -g window-status-separator ""
set -g window-status-format "  #W  "
set -g window-status-current-format "  #W  "

set -g window-status-current-style fg="#E7EAEE",bg="#171B20",bold
set -g window-status-style fg="#586172",bg="#171B20",none

set-option -g status "on"
set-option -sg escape-time 10

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g status-position top
